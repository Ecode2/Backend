upstream bookverse_app { server unix:/run/bookverse/bookverse.sock; }

server {
    listen 80;
    server_name bookverse.api.ecode2.com;
    # certbot manages the 443 server block + HTTP->HTTPS redirect.

    # NB: also set at the http level by install.sh (conf.d/bookverse-uploads.conf).
    # This directive is NOT inherited between server blocks, and nginx defaults
    # to 1M -- so the certbot-generated 443 block needs it too, which is why the
    # authoritative copy lives in conf.d.
    client_max_body_size 600M;            # large audiobook uploads
    client_body_timeout 300s;

    location /static/ { alias /opt/bookverse/app/staticfiles/; }

    # WebSocket audio stream (long-lived; needs the upgrade headers).
    location /ws/ {
        proxy_pass http://bookverse_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HTTP API. CORS (incl. OPTIONS preflight) is handled by Django.
    location / {
        proxy_pass http://bookverse_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

